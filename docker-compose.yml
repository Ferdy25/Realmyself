services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio_local_only
    ports:
      - "5432:5432"
    volumes:
      - portfolio_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    container_name: portfolio-weather-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://portfolio:portfolio_local_only@postgres:5432/portfolio
      PIPELINE_INTERVAL_SECONDS: 900
      ARTIFACTS_DIR: /app/artifacts
    ports:
      - "8002:8001"
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: portfolio-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - api

volumes:
  portfolio_pgdata:
